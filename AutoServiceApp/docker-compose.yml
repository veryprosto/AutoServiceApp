version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: my-postgres-autoservice
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: autoservice_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
